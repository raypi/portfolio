<div class="my-skills">
  <div class="skills-container">
    <h2>My skills</h2>
    <div class="skills-grid">
      <div class="skill-item" *ngFor="let skill of skills">
        <img class="logo" [src]="skill.image" [alt]="skill.name">
        <span>{{ skill.name }}</span>
      </div>
    </div>
  </div>
  <div class="skills-arrow">
    <img src="assets/img/arrowdownrightsmal.png" alt="Arrow">
  </div>
</div>
